<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151518"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#E32636" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E32636" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- Window grid -->
  <g fill="#1F1F24">
    <rect x="90" y="80" width="220" height="560" rx="6"/>
    <rect x="350" y="80" width="220" height="560" rx="6"/>
    <rect x="610" y="80" width="220" height="560" rx="6"/>
  </g>
  <g fill="#232329">
    <rect x="110" y="100" width="180" height="240" rx="4"/>
    <rect x="370" y="100" width="180" height="240" rx="4"/>
    <rect x="630" y="100" width="180" height="240" rx="4"/>
    <rect x="110" y="380" width="180" height="240" rx="4"/>
    <rect x="370" y="380" width="180" height="240" rx="4"/>
    <rect x="630" y="380" width="180" height="240" rx="4"/>
  </g>
  <!-- Ceiling lights -->
  <g>
    <rect x="820" y="90" width="440" height="8" rx="4" fill="#2A2A31"/>
    <rect x="870" y="82" width="70" height="24" rx="6" fill="#3A3A44"/>
    <rect x="1060" y="82" width="70" height="24" rx="6" fill="#3A3A44"/>
    <ellipse cx="905" cy="106" rx="90" ry="30" fill="#FF4655" opacity="0.12"/>
    <ellipse cx="1095" cy="106" rx="90" ry="30" fill="#FF4655" opacity="0.12"/>
  </g>
  <!-- Athlete lifting barbell (silhouette) -->
  <g fill="#060608">
    <!-- head -->
    <circle cx="1050" cy="330" r="34"/>
    <!-- torso leaning back -->
    <path d="M1022 360 L1078 360 L1105 520 L1000 545 Z"/>
    <!-- arms holding bar overhead -->
    <path d="M1030 362 L985 250 L1010 240 L1060 356 Z"/>
    <path d="M1070 362 L1120 250 L1145 262 L1088 360 Z"/>
    <!-- legs in lunge -->
    <path d="M1005 540 L960 720 L1000 730 L1055 555 Z"/>
    <path d="M1080 540 L1120 700 L1160 688 L1115 545 Z"/>
  </g>
  <!-- Barbell -->
  <g>
    <rect x="770" y="228" width="580" height="18" rx="9" fill="#151519"/>
    <rect x="740" y="196" width="60" height="82" rx="10" fill="#0A0A0C" stroke="#26262c" stroke-width="3"/>
    <rect x="1220" y="196" width="60" height="82" rx="10" fill="#0A0A0C" stroke="#26262c" stroke-width="3"/>
    <rect x="770" y="210" width="26" height="54" rx="6" fill="#141418" stroke="#2c2c34" stroke-width="2"/>
    <rect x="1224" y="210" width="26" height="54" rx="6" fill="#141418" stroke="#2c2c34" stroke-width="2"/>
  </g>
  <!-- Floor reflection -->
  <rect x="0" y="760" width="1600" height="140" fill="#08080A"/>
  <ellipse cx="1060" cy="780" rx="420" ry="26" fill="#E32636" opacity="0.08"/>
</svg>
